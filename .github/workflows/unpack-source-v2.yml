name: Unpack site source

on:
  push:
    paths:
      - "source-v2.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack source archive
        run: |
          rm -rf /tmp/wumetax-domain-lookup
          mkdir -p /tmp/wumetax-domain-lookup
          unzip -q -o source-v2.zip -d /tmp/wumetax-domain-lookup
          cp -a /tmp/wumetax-domain-lookup/wumetax-domain-lookup/. .
          rm -f source-v2.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Improve responsive UI, sharing and animations"
          git push
